    <!-- Esta pagina (index de /inmobiliarias) es la que PageSpeed audita para
         el directorio -- le faltaba el preconnect a Supabase y el font
         preload+swap que index.html ya tenia (commit 40e98d1 solo toco
         index.html). Sin el preconnect, PageSpeed marcaba ~300ms de ahorro
         perdido en el origen de Supabase. -->
    <link rel="preconnect" href="%VITE_SUPABASE_URL%" crossorigin />
    <!-- El video hero (section#inicio-directorio) es el elemento de LCP de
         esta pagina, pero al ser una SPA no existe en el HTML -- solo se
         pinta tras que React monte el componente. Sin este preload, el
         poster (lo que realmente se pinta como LCP) no se descubria hasta
         3.1-3.5s despues (fetchPriority=high en el <video> no sirve de nada
         si el navegador no ve la etiqueta hasta que corre el JS). -->
    <link
      rel="preload"
      as="image"
      href="/assets/inmobiliarias/ciudades/madrid.webp"
      fetchpriority="high"
    />
    <!-- Cargada como preload+swap para que no bloquee el primer render: el
         <link rel="stylesheet"> normal frena el pintado hasta que responde
         fonts.googleapis.com. onload la activa como stylesheet real; el
         <noscript> cubre el caso sin JS. -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap"
      />
    </noscript>
