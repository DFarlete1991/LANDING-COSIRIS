<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/assets/logo_orange.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="¿Cuánto vale tu propiedad? Escoge los mejores profesionales inmobiliarios verificados. Vender con un mal profesional puede hacerte perder miles de euros. Marketing para inmobiliarias, compradores y vendedores." />
    <title>Escoge la mejor inmobiliaria para venta de tu casa | Cosiris</title>
    <link rel="canonical" href="https://cosiris.com/inmobiliarias" />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://cosiris.com/inmobiliarias" />
    <meta property="og:title" content="Escoge la mejor inmobiliaria para venta de tu casa" />
    <meta property="og:description" content="¿Cuánto vale tu propiedad?&#10;Escoge los mejores profesionales inmobiliarios verificados&#10;Vender con un mal profesional puede hacerte perder miles de euros.&#10;Marketing para inmobiliarias, compradores y vendedores." />
    <meta property="og:image" content="https://cosiris.com/assets/logo_orange.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Escoge la mejor inmobiliaria para venta de tu casa" />
    <meta name="twitter:description" content="¿Cuánto vale tu propiedad? Escoge los mejores profesionales inmobiliarios verificados. Vender con un mal profesional puede hacerte perder miles de euros. Marketing para inmobiliarias, compradores y vendedores." />
    <meta name="twitter:image" content="https://cosiris.com/assets/logo_orange.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Esta pagina (index de /inmobiliarias) es la que PageSpeed audita para
         el directorio -- le faltaba el preconnect a Supabase y el font
         preload+swap que index.html ya tenia (commit 40e98d1 solo toco
         index.html). Sin el preconnect, PageSpeed marcaba ~300ms de ahorro
         perdido en el origen de Supabase. -->
    <link rel="preconnect" href="%VITE_SUPABASE_URL%" crossorigin />
    <!-- El video hero (section#inicio-directorio) es el elemento de LCP de
         esta pagina, pero al ser una SPA no existe en el HTML -- solo se
         pinta tras que React monte el componente. Sin este preload, el
         poster (lo que realmente se pinta como LCP) no se descubria hasta
         3.1-3.5s despues (fetchPriority=high en el <video> no sirve de nada
         si el navegador no ve la etiqueta hasta que corre el JS). -->
    <link
      rel="preload"
      as="image"
      href="/assets/inmobiliarias/ciudades/madrid.webp"
      fetchpriority="high"
    />
    <!-- Cargada como preload+swap para que no bloquee el primer render: el
         <link rel="stylesheet"> normal frena el pintado hasta que responde
         fonts.googleapis.com. onload la activa como stylesheet real; el
         <noscript> cubre el caso sin JS. -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap"
      />
    </noscript>

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
