<!doctype html>
<html lang="es">
  <head>
    <!-- Google Tag Manager y Meta Pixel NO se cargan aqui: solo se inyectan
         tras consentimiento del usuario, ver src/lib/cookieConsent.ts y
         CookieConsentBanner. dataLayer se declara vacio para que el codigo
         de la app pueda hacer push() antes de que (si el usuario acepta) GTM
         llegue a procesarlo. -->
    <script>window.dataLayer = window.dataLayer || [];</script>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/assets/logo_orange.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Cosiris | Agencia de marketing especializada en el sector inmobiliario. Captación y digitalización automatizada." />
    <title>Cosiris · La captación es un sistema</title>
    <link rel="canonical" href="https://cosiris.com/" />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://cosiris.com/" />
    <meta property="og:title" content="Cosiris · La captación es un sistema" />
    <meta property="og:description" content="Cosiris | Agencia de marketing especializada en el sector inmobiliario. Captación y digitalización automatizada." />
    <meta property="og:image" content="https://cosiris.com/assets/logo_orange.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Cosiris · La captación es un sistema" />
    <meta name="twitter:description" content="Cosiris | Agencia de marketing especializada en el sector inmobiliario. Captación y digitalización automatizada." />
    <meta name="twitter:image" content="https://cosiris.com/assets/logo_orange.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- El directorio de inmobiliarias (y varias otras páginas) esperan a
         esta llamada a Supabase para tener datos reales que pintar -- estaba
         en la ruta crítica sin preconectar (PageSpeed lo marcaba como ~300ms
         de ahorro). %VITE_SUPABASE_URL% lo sustituye Vite en build time con
         el valor de ese .env, así que sigue el mismo proyecto que usa la app
         en cada entorno. -->
    <link rel="preconnect" href="%VITE_SUPABASE_URL%" crossorigin />
    <!-- Cargada como preload+swap para que no bloquee el primer render: el
         <link rel="stylesheet"> normal frena el pintado hasta que responde
         fonts.googleapis.com. onload la activa como stylesheet real; el
         <noscript> cubre el caso sin JS. -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap"
      />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
