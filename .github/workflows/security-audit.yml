name: Security audit

# Se corre en cada push/PR — así ningún cambio llega a main/qa sin pasar por
# las comprobaciones de scripts/security-audit.mjs (OWASP WSTG: cabeceras,
# secretos commiteados, dependencias vulnerables, patrones de XSS/postMessage
# inseguros) ni sin que el proyecto siga compilando. El lint general (calidad
# de código, no seguridad) queda fuera a propósito: a la fecha de este
# workflow el repo ya tenía deuda de lint pre-existente ajena a seguridad, y
# mezclarla aquí solo haría que el equipo empiece a ignorar el rojo de CI.
on:
  push:
    branches: [main, qa]
  pull_request:
    branches: [main, qa]
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Auditoría de seguridad (OWASP WSTG)
        run: npm run security-audit

      - name: Build de producción
        run: npm run build

      - name: Build de la imagen Docker (lo que corre en Dokploy)
        run: docker build -t cosiris-landing-ci .
