# Generado por scripts/sync-nginx-config.mjs a partir de scripts/security-headers.mjs.
# No editar a mano — corre `node scripts/sync-nginx-config.mjs` despues de tocar
# la fuente unica de cabeceras.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; manifest-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://connect.facebook.net https://*.google-analytics.com https://*.analytics.google.com https://googleads.g.doubleclick.net https://www.googleadservices.com https://maps.googleapis.com https://www.youtube.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' https: data: blob:; media-src 'self' https: blob:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://*.googleapis.com https://maps.google.com https://www.google.com https://*.doubleclick.net https://n8n.srv1123447.hstgr.cloud https://crm.cosiris.com https://google-analytics.com https://*.google-analytics.com https://analytics.google.com https://*.analytics.google.com https://www.googletagmanager.com https://www.facebook.com https://connect.facebook.net; frame-src 'self' https://www.youtube.com https://player.vimeo.com https://www.google.com https://www.googletagmanager.com; worker-src 'self' blob:; upgrade-insecure-requests" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Directorio de inmobiliarias: entrada HTML propia (og:title/og:description
    # distintos para que WhatsApp/Facebook, que no ejecutan JS, muestren el
    # resumen correcto) — igual que el rewrite que tenia vercel.json.
    location = /inmobiliarias {
        try_files /inmobiliarias.html =404;
    }
    location ~ ^/inmobiliarias/ {
        try_files /inmobiliarias.html =404;
    }

    # Resto de rutas: SPA (React Router del lado del cliente) — si el archivo
    # no existe literalmente, cae a index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
