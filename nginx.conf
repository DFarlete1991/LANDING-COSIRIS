# Generado por scripts/sync-nginx-config.mjs a partir de scripts/security-headers.mjs.
# No editar a mano — corre `node scripts/sync-nginx-config.mjs` despues de tocar
# la fuente unica de cabeceras.

# www.cosiris.com sirve la misma app que cosiris.com (mismo server_name _ de
# abajo la responde igual), pero la clave de Google Maps solo tiene
# autorizado el referrer de cosiris.com sin "www" -> cualquiera que entre por
# www se encontraba el error "This IP, site or mobile application is not
# authorized" en los mapas. Redirigir a la version canonica (la misma que ya
# usan las etiquetas <link rel="canonical"> del sitio) lo arregla en la raiz
# sin tocar la consola de Google Cloud.
server {
    listen 80;
    server_name www.cosiris.com;
    return 301 https://cosiris.com$request_uri;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Sin esto Cache-Control/gzip quedaban en cero (auditoria de rendimiento
    # 2026-09: PageSpeed reportaba 5.4MB de ahorro potencial de cache y 60/100
    # de performance) — nginx no comprime ni cachea nada por defecto.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml image/svg+xml font/ttf font/otf application/font-woff application/font-woff2 application/wasm;

    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; manifest-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://connect.facebook.net https://*.google-analytics.com https://*.analytics.google.com https://googleads.g.doubleclick.net https://www.googleadservices.com https://maps.googleapis.com https://www.youtube.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' https: data: blob:; media-src 'self' https: blob:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://*.googleapis.com https://maps.google.com https://www.google.com https://*.doubleclick.net https://n8n.srv1123447.hstgr.cloud https://crm.cosiris.com https://google-analytics.com https://*.google-analytics.com https://analytics.google.com https://*.analytics.google.com https://www.googletagmanager.com https://www.facebook.com https://connect.facebook.net; frame-src 'self' https://www.youtube.com https://player.vimeo.com https://www.google.com https://www.googletagmanager.com; worker-src 'self' blob:; upgrade-insecure-requests" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # JS/CSS de Vite llevan hash de contenido en el nombre (main-oWtxNc1y.js):
    # si el contenido cambia, cambia el nombre. Cache de un año es seguro.
    # OJO: add_header en un location NO hereda los add_header del server (los
    # reemplaza), asi que las cabeceras de seguridad se repiten aqui.
    location ~* \.(js|css)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; manifest-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://connect.facebook.net https://*.google-analytics.com https://*.analytics.google.com https://googleads.g.doubleclick.net https://www.googleadservices.com https://maps.googleapis.com https://www.youtube.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' https: data: blob:; media-src 'self' https: blob:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://*.googleapis.com https://maps.google.com https://www.google.com https://*.doubleclick.net https://n8n.srv1123447.hstgr.cloud https://crm.cosiris.com https://google-analytics.com https://*.google-analytics.com https://analytics.google.com https://*.analytics.google.com https://www.googletagmanager.com https://www.facebook.com https://connect.facebook.net; frame-src 'self' https://www.youtube.com https://player.vimeo.com https://www.google.com https://www.googletagmanager.com; worker-src 'self' blob:; upgrade-insecure-requests" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        try_files $uri =404;
    }

    # Resto de estaticos (imagenes, video, fuentes) no llevan hash en el
    # nombre, asi que el cache es mas corto por si se reemplaza el archivo.
    location ~* \.(png|jpg|jpeg|webp|gif|svg|ico|mp4|woff2?|ttf|otf)$ {
        add_header Cache-Control "public, max-age=2592000" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; manifest-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://connect.facebook.net https://*.google-analytics.com https://*.analytics.google.com https://googleads.g.doubleclick.net https://www.googleadservices.com https://maps.googleapis.com https://www.youtube.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' https: data: blob:; media-src 'self' https: blob:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://*.googleapis.com https://maps.google.com https://www.google.com https://*.doubleclick.net https://n8n.srv1123447.hstgr.cloud https://crm.cosiris.com https://google-analytics.com https://*.google-analytics.com https://analytics.google.com https://*.analytics.google.com https://www.googletagmanager.com https://www.facebook.com https://connect.facebook.net; frame-src 'self' https://www.youtube.com https://player.vimeo.com https://www.google.com https://www.googletagmanager.com; worker-src 'self' blob:; upgrade-insecure-requests" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        try_files $uri =404;
    }

    # Directorio de inmobiliarias: entrada HTML propia (og:title/og:description
    # distintos para que WhatsApp/Facebook, que no ejecutan JS, muestren el
    # resumen correcto) — igual que el rewrite que tenia vercel.json.
    location = /inmobiliarias {
        try_files /inmobiliarias.html =404;
    }
    location ~ ^/inmobiliarias/ {
        try_files /inmobiliarias.html =404;
    }

    # Resto de rutas: SPA (React Router del lado del cliente) — si el archivo
    # no existe literalmente, cae a index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
